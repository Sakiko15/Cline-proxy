version: "3.9"

services:
  cline-proxy:
    build: .
    image: ghcr.io/sakiko15/cline-proxy:latest
    container_name: cline-proxy
    restart: unless-stopped
    ports:
      - "3457:3457"
    volumes:
      - ./data:/app/data
      - ./override.md:/app/override.md:ro
    environment:
      - PORT=3457
      - TZ=Asia/Shanghai
